{{ define "main" }}
<article>
  <header class="note-head">
    <h1>{{ .Title }}</h1>
    <p class="note-meta">
      {{- if not .Date.IsZero }}<span>{{ .Date.Format "2006-01-02" }}</span>{{ end -}}
      {{- with .Params.status }}<span>{{ . }}</span>{{ end -}}
      {{- with .Section }}<span>{{ . }}</span>{{ end -}}
    </p>
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
