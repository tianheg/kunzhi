<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="每日小票打印机：手绘草稿风格封面">
  <style>
    :root {
      --paper:  #f4f1e7;
      --ink:    #26241e;
      --rule:   #cdc7b0;
      --mute:   #6f6b5c;
      --red:    #a8342a;
      --screen: #e9e5d8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper:  #17150f;
        --ink:    #e9e4d6;
        --rule:   #3a352c;
        --mute:   #9a9384;
        --red:    #d9705f;
        --screen: #221f18;
      }
    }
    .bg { fill: var(--paper); }
    .ink { stroke: var(--ink); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke: var(--rule); fill: none; stroke-width: 1.2; }
    .fill-ink { fill: var(--ink); }
    .mute { fill: var(--mute); font-family: "Courier New", monospace; font-size: 13px; letter-spacing: 1px; }
    .hand { fill: var(--red); font-family: "Kaiti SC", "STKaiti", "KaiTi", cursive; font-size: 20px; }
    .hand-s { fill: var(--red); font-family: "Kaiti SC", "STKaiti", "KaiTi", cursive; font-size: 15px; }
    .paper-txt { fill: var(--mute); font-family: "Courier New", monospace; font-size: 11px; }
    .redline { stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect class="bg" x="0" y="0" width="800" height="600"/>

  <!-- 桌面线 -->
  <path class="thin" d="M40 500 H760"/>
  <path class="thin" d="M40 508 H360" stroke-dasharray="6 8"/>

  <!-- 机身 -->
  <rect class="ink" x="190" y="300" width="330" height="170" rx="4"/>
  <path class="ink" d="M215 300 L235 250 H475 L495 300"/>
  <!-- 出纸口 -->
  <path class="ink" d="M250 300 H460"/>
  <path class="thin" d="M256 286 H454"/>

  <!-- 纸带：从出纸口向上延伸 -->
  <path class="ink" d="M268 250 V120 Q268 108 280 108 H430 Q442 108 442 120 V250"/>
  <path class="thin" d="M268 150 H442" stroke-dasharray="7 7"/>
  <!-- 纸上的内容示意 -->
  <path class="thin" d="M286 136 H360"/>
  <path class="thin" d="M286 158 H420"/>
  <!-- 勾选框 -->
  <rect class="ink" x="286" y="176" width="18" height="18" rx="2" stroke-width="1.6"/>
  <path class="thin" d="M314 185 H420"/>
  <rect class="ink" x="286" y="206" width="18" height="18" rx="2" stroke-width="1.6"/>
  <path class="thin" d="M314 215 H400"/>
  <path class="redline" d="M288 178 L293 184 L302 172"/>
  <!-- 锯齿撕口 -->
  <path class="thin" d="M268 120 L276 128 L284 120 L292 128 L300 120 L308 128 L316 120 L324 128 L332 120 L340 128 L348 120 L356 128 L364 120 L372 128 L380 120 L388 128 L396 120 L404 128 L412 120 L420 128 L428 120 L436 128 L442 120" stroke-dasharray="0"/>

  <!-- 指示灯与按钮 -->
  <circle class="ink" cx="440" cy="330" r="7"/>
  <path class="redline" d="M437 327 L443 333 M443 327 L437 333"/>
  <rect class="ink" x="220" y="330" width="54" height="26" rx="4" stroke-width="1.6"/>
  <path class="thin" d="M232 343 H262"/>

  <!-- 机身文字 -->
  <text class="mute" x="220" y="400">THERMAL</text>
  <text class="mute" x="220" y="420">80mm / 203dpi</text>
  <text class="mute" x="220" y="440">576 dots</text>

  <!-- 红笔批注 -->
  <path class="redline" d="M500 300 Q560 290 596 268"/>
  <text class="hand" x="600" y="262">9100 raw</text>
  <path class="redline" d="M446 186 Q520 200 556 226"/>
  <text class="hand-s" x="560" y="232">9.4 cm</text>
  <path class="redline" d="M270 96 Q236 78 206 86"/>
  <text class="hand-s" x="66" y="80">勾选清单</text>

  <text class="hand" x="586" y="430">每天 22 cm</text>
  <path class="redline" d="M520 470 Q560 452 578 444"/>

  <!-- 角落标记 -->
  <text class="mute" x="40" y="546">SKETCH / REV 0.1</text>
  <text class="mute" x="640" y="546">已发布</text>
</svg>
