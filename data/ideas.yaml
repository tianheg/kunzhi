# 项目页「抽一条」的池子。
#
# 每条三个字段：
#   title  必填，一条 idea 的名字
#   note   必填，一句话说清这是个什么东西
#   hint   可选，成本 / 门槛 / 前提条件（等宽小字，行末显示）
#
# 只放**还没写进上面项目清单**的构思。写成了项目条目就把它从这儿删掉。
# 键名一律小写（Hugo 读 data 文件时按小写取键）。

- title: 桌面电子墨水天气站
  note: 一块 E-ink 挂在墙上不动，一天刷一次，数据自己抓，不看手机。
  hint: 器件 ¥80–150，纯软件活，不需要焊接

- title: NAS 电费账本
  note: 把插座功率计的读数接进来，按天记 NAS 到底吃掉多少电。
  hint: 一个智能插座 + 几十行脚本，零新增硬件

- title: 分体式机械键盘
  note: 把手上的键盘从中间切开做成分体式，两块板的角度自己定。
  hint: 需要 3D 打印外壳与重新飞线，难度中等

- title: 骑行路书生成器
  note: 把多天长途路线的 GPX 画成一张能打印的路书，每天的分段和爬升一眼看完。
  hint: 零硬件成本，纯粹是个数据处理 + 排版问题

- title: 会动的桌面 AI 体
  note: 让模型从「会答」变成「会感知、会动」——一颗 ESP32-S3 挂麦克风与两只舵机，听懂环境后转个身、点个头。
  hint: 器件 ¥100 级；小智那套现成固件能起步，难点是「感知 → 动作」这段闭环

- title: 桌面三轴机械臂
  note: 舵机堆一只真能抓东西的三轴臂，把正逆运动学与手眼标定跑通——机器人方向的入门，先不碰人形。
  hint: 舵机组 ¥150–300；标定与重复精度才是主要工作量

- title: 骑行数据记录仪
  note: 自己抓码表与功率计的 ANT+ / BLE 广播，落地成自己的文件——骑了多少只有自己说了算，不看厂商云。
  hint: 一颗 ESP32 做 BLE 扫描即可；手上已有传感器的话零新增硬件

- title: 进 muShenzhen Garage 待一个月
  note: 带一个已有原型进这座城市的 28 天驻留，把设计、打样、测试、改的回路连着跑一遍，顺便认识全球 builder。
  hint: 2026-11-20 → 12-18；100 名额，门槛是手上得有 Demo
